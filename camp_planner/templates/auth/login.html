{% extends "_layouts/page.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Přihlášení – Camp Planner{% endblock %}
{% block cp_content %}
  <h1>Přihlášení</h1>
  <form class="cp-form" method="post" action="{{ url_for('auth.login') }}">
    {{ csrf() }}
    <input type="hidden" name="next" value="{{ next }}">
    <label>Uživatelské jméno <input name="username" value="{{ username }}" autofocus required></label>
    <label>Heslo <input name="password" type="password" required></label>
    <button type="submit">Přihlásit se</button>
  </form>
{% endblock %}
